apiVersion: v1
kind: Namespace
metadata:
  name: argocd
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: togglemaster-gitops
  namespace: argocd
spec:
  interval: 1m
  url: https://github.com/SEU_USUARIO/SEU_REPO_GITOPS.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: togglemaster-apps
  namespace: argocd
spec:
  interval: 1m
  path: ./
  prune: true
  sourceRef:
    kind: GitRepository
    name: togglemaster-gitops
