name: ToggleMaster CI/CD DevSecOps

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]


jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, flag-service, targeting-service, evaluation-service, analytics-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        if: matrix.service == 'auth-service' || matrix.service == 'evaluation-service'
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Python
        if: matrix.service == 'flag-service' || matrix.service == 'targeting-service' || matrix.service == 'analytics-service'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          if [ ! -d "${{ matrix.service }}" ]; then
            echo "Pasta '${{ matrix.service }}' não existe neste repositório. Pulando etapa de build para este serviço."
            exit 0
          fi

          if [ "${{ matrix.service }}" = "auth-service" ] || [ "${{ matrix.service }}" = "evaluation-service" ]; then
            cd ${{ matrix.service }} && go mod download && go test ./...
          else
            cd ${{ matrix.service }} && python -m pip install --upgrade pip && pip install -r requirements.txt && pytest -q || true
          fi

  lint-and-security:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Run Gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./... || true

      - name: Run Bandit
        run: |
          python -m pip install bandit
          bandit -r . -q || true

  docker-build-and-push:
    runs-on: ubuntu-latest
    needs: lint-and-security
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        run: |
          IMAGE_TAG=${{ github.sha }}
          for svc in auth-service flag-service targeting-service evaluation-service analytics-service; do
            docker build -t ${{ steps.login-ecr.outputs.registry }}/$svc:$IMAGE_TAG ./$svc
            docker push ${{ steps.login-ecr.outputs.registry }}/$svc:$IMAGE_TAG
          done

      - name: Scan Docker image with Trivy
        run: |
          IMAGE_TAG=${{ github.sha }}
          for svc in auth-service flag-service targeting-service evaluation-service analytics-service; do
            trivy image --severity CRITICAL,HIGH --exit-code 1 ${{ steps.login-ecr.outputs.registry }}/$svc:$IMAGE_TAG
          done

      - name: Update GitOps image tags
        run: |
          IMAGE_TAG=${{ github.sha }}
          python - <<'PY'
          from pathlib import Path
          image_tag = "${{ github.sha }}"
          base = Path('gitops/apps')
          for file in base.glob('*.yaml'):
              text = file.read_text()
              text = text.replace('newTag: latest', f'newTag: {image_tag}')
              file.write_text(text)
          print(f'GitOps tags updated to {image_tag}')
          PY
